<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoF Design Patterns &amp; SOLID</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2433; --muted:#6b7280; --accent:#2f5bea; --line:#e3e6ec; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); display:flex; height:100vh; }
  nav { width:270px; overflow:auto; background:var(--panel); border-right:1px solid var(--line); padding:12px 0; }
  nav h1 { font-size:15px; margin:4px 16px 8px; }
  nav input { margin:0 16px 8px; width:calc(100% - 32px); padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  nav h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 16px 4px; }
  nav a { display:block; padding:5px 16px; color:var(--ink); text-decoration:none; cursor:pointer; }
  nav a:hover { background:var(--bg); }
  nav a.active { background:#e8eefe; color:var(--accent); font-weight:600; }
  main { flex:1; overflow:auto; padding:20px 28px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); background:var(--panel); padding:6px 14px; border-radius:6px; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 20px; }
  pre.out { background:#111827; color:#e5e7eb; padding:14px 16px; border-radius:8px; overflow:auto; white-space:pre-wrap; font:13px/1.5 Consolas, monospace; margin:0; }
  .doc pre { background:#f1f3f7; padding:10px 12px; border-radius:6px; overflow:auto; }
  .doc code { background:#f1f3f7; padding:1px 4px; border-radius:4px; }
  .doc pre code { background:none; padding:0; }
  .doc table { border-collapse:collapse; } .doc td, .doc th { border:1px solid var(--line); padding:4px 8px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<nav>
  <h1>Design Patterns &amp; SOLID</h1>
  <input id="filter" placeholder="Filter...">
  <div id="menu"></div>
</nav>
<main>
  <div id="placeholder" class="muted">Pick a pattern or principle from the left to run its demo.</div>
  <div id="view" hidden>
    <h2 id="title" style="margin-top:0"></h2>
    <div class="tabs">
      <button id="tab-out" class="on">Demo output</button>
      <button id="tab-doc">Explanation &amp; UML</button>
    </div>
    <pre id="out" class="out"></pre>
    <div id="doc" class="card doc" hidden></div>
  </div>
</main>

<script type="module">
let mermaid = null;
try {
  ({ default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"));
  mermaid.initialize({ startOnLoad: false });
} catch { /* offline: diagrams are shown as text */ }

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let demos = [];

function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

// Minimal markdown: headings, fenced code (+mermaid), lists, tables, paragraphs.
function markdown(md) {
  const lines = md.split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const lang = l.slice(3).trim(), buf = [];
      while (++i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i]);
      out.push(lang === "mermaid" && mermaid
        ? `<pre class="mermaid">${esc(buf.join("\n"))}</pre>`
        : `<pre><code>${esc(buf.join("\n"))}</code></pre>`);
    } else if (/^#{1,6} /.test(l)) {
      const n = l.match(/^#+/)[0].length;
      out.push(`<h${n}>${inline(l.replace(/^#+ /, ""))}</h${n}>`);
    } else if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      i--;
      const cells = (r) => r.split("|").slice(1, -1).map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:-]+\|/.test(r) || /[A-Za-z0-9]/.test(r));
      out.push("<table>" + body.map((r, k) => `<tr>${cells(r).map((c) => `<${k ? "td" : "th"}>${inline(c)}</${k ? "td" : "th"}>`).join("")}</tr>`).join("") + "</table>");
    } else if (/^\s*[-*] /.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*] /.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*] /, ""));
      i--;
      out.push("<ul>" + items.map((t) => `<li>${inline(t)}</li>`).join("") + "</ul>");
    } else if (l.trim()) {
      out.push(`<p>${inline(l)}</p>`);
    }
  }
  return out.join("\n");
}

function showTab(which) {
  $("out").hidden = which !== "out";
  $("doc").hidden = which !== "doc";
  $("tab-out").classList.toggle("on", which === "out");
  $("tab-doc").classList.toggle("on", which === "doc");
}
$("tab-out").onclick = () => showTab("out");
$("tab-doc").onclick = () => showTab("doc");

async function select(demo, link) {
  document.querySelectorAll("nav a").forEach((a) => a.classList.remove("active"));
  link.classList.add("active");
  $("placeholder").hidden = true;
  $("view").hidden = false;
  $("title").textContent = `${demo.group}: ${demo.name}`;
  $("out").textContent = "Running...";
  const res = await (await fetch(`/api/run?id=${encodeURIComponent(demo.id)}`)).json();
  $("out").textContent = res.output || "(no output)";
  $("doc").innerHTML = markdown(res.readme || "_No README found._");
  if (mermaid) await mermaid.run({ nodes: $("doc").querySelectorAll(".mermaid") }).catch(() => {});
  showTab("out");
}

function render(filter = "") {
  const menu = $("menu");
  menu.innerHTML = "";
  let group = "";
  for (const d of demos.filter((d) => d.name.toLowerCase().includes(filter.toLowerCase()))) {
    if (d.group !== group) {
      group = d.group;
      const h = document.createElement("h2");
      h.textContent = group;
      menu.append(h);
    }
    const a = document.createElement("a");
    a.textContent = d.name;
    a.onclick = () => select(d, a);
    menu.append(a);
  }
}

$("filter").oninput = (e) => render(e.target.value);
demos = await (await fetch("/api/demos")).json();
render();
</script>
</body>
</html>
